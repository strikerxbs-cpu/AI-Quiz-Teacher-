<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Quiz Teacher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>🤖 AI Quiz Teacher</h1>
    <p>শিখো • খেলো • জ্ঞান বাড়াও</p>
</header>

<main>

    <!-- SUBJECT -->
    <section class="card">
        <h2>📚 বিষয় নির্বাচন করো</h2>

        <select id="subjectSelect">
            <option value="bangla">বাংলা</option>
            <option value="english">ইংরেজি</option>
            <option value="math">গণিত</option>
            <option value="science">বিজ্ঞান</option>
            <option value="ict">আইসিটি</option>
            <option value="general">সাধারণ জ্ঞান</option>
        </select>
    </section>


    <!-- QUESTION COUNT -->
    <section class="card">
        <h2>🎯 কতটি প্রশ্ন দিতে চাও?</h2>

        <div class="count-buttons">

            <button type="button" onclick="startQuiz(10)">
                ১০ প্রশ্ন
            </button>

            <button type="button" onclick="startQuiz(20)">
                ২০ প্রশ্ন
            </button>

            <button type="button" onclick="startQuiz(30)">
                ৩০ প্রশ্ন
            </button>

            <button type="button" class="sixty" onclick="startQuiz(60)">
                🏆 ৬০ প্রশ্ন
            </button>

        </div>
    </section>


    <!-- QUIZ AREA -->
    <section id="quizSection" class="card quiz-section">

        <div class="quiz-top">
            <strong id="questionNumber">
                প্রশ্ন ০ / ০
            </strong>

            <strong id="score">
                স্কোর: ০
            </strong>
        </div>


        <div id="questionBox">
            <h2 id="questionText">
                প্রশ্ন এখানে আসবে
            </h2>
        </div>


        <!-- ANSWERS -->
        <div id="answers" class="answers"></div>


        <!-- RESULT MESSAGE -->
        <div id="feedback" class="feedback"></div>


        <!-- AUTO NEXT INFO -->
        <div id="nextMessage" class="next-message"></div>


        <!-- ROBOT TEACHER -->
        <div id="teacherBox" class="teacher-box">
            🤖 রোবট শিক্ষক:
            <span id="teacherText">
                একটি উত্তর নির্বাচন করো।
            </span>
        </div>


        <!-- VOICE BUTTON -->
        <button
            type="button"
            class="voice-button"
            onclick="speakCurrentFeedback()">
            🔊 প্রশ্ন/ফলাফল শুনুন
        </button>

    </section>


    <!-- FINAL RESULT -->
    <section id="resultSection" class="card result-section">

        <div class="trophy">
            🏆
        </div>

        <h2>Quiz শেষ!</h2>

        <h3 id="finalScore">
            তোমার স্কোর: ০ / ০
        </h3>


        <div class="result-grid">

            <div class="result-box">
                <strong id="correctCount">০</strong>
                <span>সঠিক</span>
            </div>

            <div class="result-box">
                <strong id="wrongCount">০</strong>
                <span>ভুল</span>
            </div>

            <div class="result-box">
                <strong id="percentage">০%</strong>
                <span>ফলাফল</span>
            </div>

        </div>


        <button
            type="button"
            class="restart-btn"
            onclick="restartQuiz()">
            🔄 আবার Quiz দাও
        </button>

    </section>

</main>


<footer>
    🤖 AI Quiz Teacher<br>
    Made for Smart Learning
</footer>


<!-- IMPORTANT: JavaScript -->
<script src="script.js"></script>

</body>
</html>
