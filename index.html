<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5146e5">
  <title>AI Quiz Teacher</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <div class="robot">🤖</div>
  <h1>AI Quiz Teacher</h1>
  <p>Learn • Practice • Quiz • Improve</p>
</header>

<main class="container">

  <!-- Teacher -->
  <section class="card">
    <h2>👨‍🏫 Robo Teacher</h2>

    <textarea id="studentQuestion"
      placeholder="Robo Teacher-কে প্রশ্ন করো..."></textarea>

    <button class="primary-btn" onclick="askTeacher()">
      ✨ উত্তর দাও
    </button>

    <div id="teacherAnswer" class="answer-box">
      <h3>🤖 Robo Teacher বলছে:</h3>
      <p id="teacherAnswerText"></p>

      <button class="voice-btn" onclick="speakAnswer()">
        🔊 শুনুন
      </button>
    </div>
  </section>


  <!-- Quiz selection -->
  <section class="card">
    <h2>🎯 Smart Quiz</h2>

    <select id="subjectSelect">
      <option value="bangla">বাংলা</option>
      <option value="english">English</option>
      <option value="math">গণিত</option>
      <option value="science">বিজ্ঞান</option>
      <option value="ict">ICT</option>
      <option value="bgs">বাংলাদেশ ও বিশ্বপরিচয়</option>
    </select>

    <div class="quiz-buttons">
      <button onclick="startQuiz(10)">১০ প্রশ্ন</button>
      <button onclick="startQuiz(20)">২০ প্রশ্ন</button>
      <button onclick="startQuiz(50)">৫০ প্রশ্ন</button>
      <button class="big-quiz" onclick="startQuiz(60)">🏆 ৬০ প্রশ্ন</button>
    </div>
  </section>


  <!-- Quiz -->
  <section id="quizArea" class="card quiz-card">

    <div class="quiz-top">
      <span id="questionNumber">প্রশ্ন ১</span>
      <span id="scoreDisplay">স্কোর: ০</span>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <h2 id="question">প্রশ্ন এখানে আসবে</h2>

    <div id="options"></div>

    <!-- Result of current answer -->
    <div id="answerResult"></div>

    <div id="explanation">
      <h3>💡 ব্যাখ্যা</h3>
      <p id="explanationText"></p>
    </div>

  </section>


  <!-- Final result -->
  <section id="resultArea" class="card result-card">

    <div class="trophy">🏆</div>

    <h2>Quiz শেষ!</h2>

    <h3 id="resultText"></h3>

    <div class="result-grid">

      <div>
        <strong id="correctCount">০</strong>
        <span>সঠিক</span>
      </div>

      <div>
        <strong id="wrongCount">০</strong>
        <span>ভুল</span>
      </div>

      <div>
        <strong id="percentage">০%</strong>
        <span>Result</span>
      </div>

    </div>

    <button class="primary-btn" onclick="restartQuiz()">
      🔄 আবার Quiz দাও
    </button>

  </section>

</main>


<footer>
  🤖 AI Quiz Teacher<br>
  Made for Smart Learning
</footer>

/* =========================
   QUIZ SYSTEM
========================= */

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;


/* বাংলা সংখ্যা */
function bnNumber(number) {
  return String(number).replace(/[0-9]/g, d => "০১২৩৪৫৬৭৮৯"[d]);
}


/* Start quiz */
function startQuiz(amount) {

  const subject = document.getElementById("subjectSelect").value;

  let bank = questions[subject] || [];

  currentQuestions = [...bank];

  /* Shuffle */
  currentQuestions.sort(() => Math.random() - 0.5);

  /* যদি ১০টির বেশি প্রশ্ন চাওয়া হয়,
     প্রশ্নগুলো আবার ব্যবহার করে পূরণ করবে */
  let original = [...currentQuestions];

  while (currentQuestions.length < amount) {
    currentQuestions = currentQuestions.concat(
      [...original].sort(() => Math.random() - 0.5)
    );
  }

  currentQuestions = currentQuestions.slice(0, amount);

  currentIndex = 0;
  score = 0;

  document.getElementById("quizArea").style.display = "block";
  document.getElementById("resultArea").style.display = "none";

  document.getElementById("quizArea").scrollIntoView({
    behavior:"smooth"
  });

  showQuestion();
}


/* Show question */
function showQuestion() {

  answered = false;

  const item = currentQuestions[currentIndex];

  document.getElementById("questionNumber").textContent =
    "প্রশ্ন " + bnNumber(currentIndex + 1) +
    " / " + bnNumber(currentQuestions.length);

  document.getElementById("scoreDisplay").textContent =
    "স্কোর: " + bnNumber(score);

  document.getElementById("question").textContent = item.q;

  const options = document.getElementById("options");

  options.innerHTML = "";

  document.getElementById("answerResult").innerHTML = "";

  document.getElementById("explanation").style.display = "none";

  const percent =
    ((currentIndex) / currentQuestions.length) * 100;

  document.getElementById("progressBar").style.width =
    percent + "%";


  item.o.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option-btn";

    button.textContent =
      String.fromCharCode(65 + index) + ". " + option;

    button.onclick = () => checkAnswer(index);

    options.appendChild(button);

  });
}


/* Check answer */
function checkAnswer(selected) {

  if (answered) return;

  answered = true;

  const item = currentQuestions[currentIndex];

  const buttons =
    document.querySelectorAll(".option-btn");

  buttons.forEach(btn => {
    btn.disabled = true;
  });


  if (selected === item.a) {

    score++;

    buttons[selected].classList.add("correct");

    document.getElementById("answerResult").innerHTML =
      "✅ সঠিক হয়েছে! 🎉";

  } else {

    buttons[selected].classList.add("wrong");

    buttons[item.a].classList.add("correct");

    document.getElementById("answerResult").innerHTML =
      "❌ ভুল হয়েছে!";

  }


  document.getElementById("scoreDisplay").textContent =
    "স্কোর: " + bnNumber(score);


  document.getElementById("explanationText").textContent =
    item.e;

  document.getElementById("explanation").style.display =
    "block";


  /*
    গুরুত্বপূর্ণ:
    এখানে কোনো Next button নেই।
    ১.৫ সেকেন্ড পরে নিজে থেকেই পরের প্রশ্ন।
  */

  setTimeout(() => {

    currentIndex++;

    if (currentIndex < currentQuestions.length) {

      showQuestion();

    } else {

      showResult();

    }

  }, 1500);

}


/* Result */
function showResult() {

  document.getElementById("quizArea").style.display =
    "none";

  document.getElementById("resultArea").style.display =
    "block";

  const total = currentQuestions.length;

  const wrong = total - score;

  const percent =
    Math.round((score / total) * 100);

  document.getElementById("correctCount").textContent =
    bnNumber(score);

  document.getElementById("wrongCount").textContent =
    bnNumber(wrong);

  document.getElementById("percentage").textContent =
    bnNumber(percent) + "%";

  document.getElementById("resultText").textContent =
    "তোমার স্কোর: " +
    bnNumber(score) +
    " / " +
    bnNumber(total) +
    " (" +
    bnNumber(percent) +
    "%)";

  document.getElementById("resultArea").scrollIntoView({
    behavior:"smooth"
  });
}


/* Restart */
function restartQuiz() {

  document.getElementById("resultArea").style.display =
    "none";

  document.getElementById("quizArea").style.display =
    "none";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* Voice */
function speakAnswer() {

  const text =
    document.getElementById("teacherAnswerText")
    .textContent;

  if (!("speechSynthesis" in window)) {

    alert("এই ব্রাউজারে Voice সুবিধা পাওয়া যায়নি।");

    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "bn-BD";
  speech.rate = 0.9;
  speech.pitch = 1;
  speech.volume = 1;

  const voices =
    window.speechSynthesis.getVoices();

  const banglaVoice =
    voices.find(v =>
      v.lang &&
      v.lang.toLowerCase().startsWith("bn")
    );

  if (banglaVoice) {
    speech.voice = banglaVoice;
  }

  window.speechSynthesis.speak(speech);
}


/* Voice list load */
window.speechSynthesis &&
window.speechSynthesis.addEventListener(
  "voiceschanged",
  function() {
    window.speechSynthesis.getVoices();
  }
);
