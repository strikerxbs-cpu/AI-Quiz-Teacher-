<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5146e5">
  <title>AI Quiz Teacher</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <div class="robot">🤖</div>
  <h1>AI Quiz Teacher</h1>
  <p>Learn • Practice • Quiz • Improve</p>
</header>

<main class="container">

  <!-- Teacher -->
  <section class="card">
    <h2>👨‍🏫 Robo Teacher</h2>

    <textarea id="studentQuestion"
      placeholder="Robo Teacher-কে প্রশ্ন করো..."></textarea>

    <button class="primary-btn" onclick="askTeacher()">
      ✨ উত্তর দাও
    </button>

    <div id="teacherAnswer" class="answer-box">
      <h3>🤖 Robo Teacher বলছে:</h3>
      <p id="teacherAnswerText"></p>

      <button class="voice-btn" onclick="speakAnswer()">
        🔊 শুনুন
      </button>
    </div>
  </section>


  <!-- Quiz selection -->
  <section class="card">
    <h2>🎯 Smart Quiz</h2>

    <select id="subjectSelect">
      <option value="bangla">বাংলা</option>
      <option value="english">English</option>
      <option value="math">গণিত</option>
      <option value="science">বিজ্ঞান</option>
      <option value="ict">ICT</option>
      <option value="bgs">বাংলাদেশ ও বিশ্বপরিচয়</option>
    </select>

    <div class="quiz-buttons">
      <button onclick="startQuiz(10)">১০ প্রশ্ন</button>
      <button onclick="startQuiz(20)">২০ প্রশ্ন</button>
      <button onclick="startQuiz(50)">৫০ প্রশ্ন</button>
      <button class="big-quiz" onclick="startQuiz(60)">🏆 ৬০ প্রশ্ন</button>
    </div>
  </section>


  <!-- Quiz -->
  <section id="quizArea" class="card quiz-card">

    <div class="quiz-top">
      <span id="questionNumber">প্রশ্ন ১</span>
      <span id="scoreDisplay">স্কোর: ০</span>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <h2 id="question">প্রশ্ন এখানে আসবে</h2>

    <div id="options"></div>

    <!-- Result of current answer -->
    <div id="answerResult"></div>

    <div id="explanation">
      <h3>💡 ব্যাখ্যা</h3>
      <p id="explanationText"></p>
    </div>

  </section>


  <!-- Final result -->
  <section id="resultArea" class="card result-card">

    <div class="trophy">🏆</div>

    <h2>Quiz শেষ!</h2>

    <h3 id="resultText"></h3>

    <div class="result-grid">

      <div>
        <strong id="correctCount">০</strong>
        <span>সঠিক</span>
      </div>

      <div>
        <strong id="wrongCount">০</strong>
        <span>ভুল</span>
      </div>

      <div>
        <strong id="percentage">০%</strong>
        <span>Result</span>
      </div>

    </div>

    <button class="primary-btn" onclick="restartQuiz()">
      🔄 আবার Quiz দাও
    </button>

  </section>

</main>


<footer>
  🤖 AI Quiz Teacher<br>
  Made for Smart Learning
</footer>
