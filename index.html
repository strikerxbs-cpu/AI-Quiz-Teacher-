<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Quiz Teacher</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">
    <div class="robot">🤖</div>
    <h1>AI Quiz Teacher</h1>
    <p>শিখ • খেল • জ্ঞান বাড়াও</p>
  </header>

  <main>

    <!-- SUBJECT -->
    <section class="card">
      <h2>📚 বিষয় নির্বাচন করো</h2>

      <select id="subjectSelect">
        <option value="bangla">বাংলা</option>
        <option value="english">ইংরেজি</option>
        <option value="math">গণিত</option>
        <option value="science">বিজ্ঞান</option>
        <option value="ict">আইসিটি</option>
        <option value="bgs">বাংলাদেশ ও বিশ্বপরিচয়</option>
      </select>
    </section>


    <!-- QUIZ -->
    <section class="card">

      <div class="quiz-top">
        <strong>
          প্রশ্ন <span id="questionNumber">1</span> / 60
        </strong>

        <strong>
          স্কোর: <span id="score">0</span>
        </strong>
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <h2 id="question">
        প্রশ্ন লোড হচ্ছে...
      </h2>

      <div id="options"></div>

      <div id="feedback" class="feedback"></div>

      <button id="speakButton" class="voice-btn" onclick="speakFeedback()">
        🔊 প্রশ্ন/ফলাফল শুনুন
      </button>

      <button id="nextButton" class="next-btn" onclick="nextQuestion()" style="display:none;">
        ➡️ পরের প্রশ্ন
      </button>

    </section>


    <!-- RESULT -->
    <section id="resultCard" class="card result-card" style="display:none;">

      <div class="trophy">🏆</div>

      <h2>Quiz শেষ!</h2>

      <h3>
        তোমার স্কোর:
        <span id="finalScore">0</span> / 60
      </h3>

      <div class="result-box">
        <strong id="correctCount">0</strong>
        <span>সঠিক</span>
      </div>

      <div class="result-box">
        <strong id="wrongCount">0</strong>
        <span>ভুল</span>
      </div>

      <div class="result-box">
        <strong id="percentage">0%</strong>
        <span>ফলাফল</span>
      </div>

      <button class="restart-btn" onclick="restartQuiz()">
        🔄 আবার Quiz দাও
      </button>

    </section>

  </main>


  <footer>
    🤖 AI Quiz Teacher<br>
    Made for Smart Learning
  </footer>


  <!-- IMPORTANT: JavaScript file -->
  <script src="script.js"></script>

</body>
  </html>
