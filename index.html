<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5146e5">
  <title>AI Quiz Teacher</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <div class="robot">🤖</div>
  <h1>AI Quiz Teacher</h1>
  <p>শিখুন • অনুশীলন করুন • Quiz দিন • নিজের স্কোর দেখুন</p>
</header>

<main class="container">

  <!-- Robo Teacher -->
  <section class="card">
    <h2>👨‍🏫 Robo Teacher-কে প্রশ্ন করো</h2>

    <textarea id="studentQuestion"
      placeholder="যেমন: HTML কী?"></textarea>

    <button class="primary-btn" onclick="askTeacher()">
      ✨ Explanation দাও
    </button>

    <div id="teacherAnswer" class="answer-box hidden">
      <h3>🤖 Robo Teacher বলছে:</h3>
      <p id="teacherAnswerText"></p>

      <button class="voice-btn" onclick="speakAnswer()">
        🔊 শুনুন
      </button>
    </div>
  </section>

  <!-- Quiz -->
  <section class="card">
    <h2>🎯 Smart Quiz</h2>

    <select id="subjectSelect">
      <option value="bangla">বাংলা</option>
      <option value="english">English</option>
      <option value="math">গণিত</option>
      <option value="science">বিজ্ঞান</option>
      <option value="ict">ICT</option>
      <option value="bgs">বাংলাদেশ ও বিশ্বপরিচয়</option>
    </select>

    <div class="quiz-buttons">
      <button onclick="startQuiz(10)">১০ প্রশ্ন</button>
      <button onclick="startQuiz(20)">২০ প্রশ্ন</button>
      <button onclick="startQuiz(30)">৩০ প্রশ্ন</button>
      <button onclick="startQuiz(40)">৪০ প্রশ্ন</button>
      <button onclick="startQuiz(50)">৫০ প্রশ্ন</button>
      <button class="big-btn" onclick="startQuiz(60)">🏆 ৬০ প্রশ্ন</button>
    </div>
  </section>

  <!-- Quiz Area -->
  <section id="quizArea" class="card hidden">

    <div class="quiz-top">
      <span id="questionNumber">প্রশ্ন ১/৬০</span>
      <span id="scoreDisplay">স্কোর: ০</span>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <h2 id="question"></h2>

    <div id="options"></div>

    <div id="explanation" class="explanation hidden">
      <h3>💡 ব্যাখ্যা</h3>
      <p id="explanationText"></p>
    </div>

    <button id="nextButton"
      class="primary-btn hidden"
      onclick="nextQuestion()">
      ➡️ পরের প্রশ্ন
    </button>

  </section>

  <!-- Result -->
  <section id="resultArea" class="card result-card hidden">

    <div class="trophy">🏆</div>

    <h2>Quiz শেষ!</h2>

    <h3 id="resultText"></h3>

    <div class="result-grid">

      <div>
        <strong id="correctCount">০</strong>
        <span>সঠিক</span>
      </div>

      <div>
        <strong id="wrongCount">০</strong>
        <span>ভুল</span>
      </div>

      <div>
        <strong id="percentage">০%</strong>
        <span>Result</span>
      </div>

    </div>

    <button class="primary-btn" onclick="restartQuiz()">
      🔄 আবার Quiz দাও
    </button>

  </section>

</main>

<footer>
  🤖 AI Quiz Teacher<br>
  Made for Smart Learning
</footer>


<script>

/* =====================================================
   QUESTION GENERATORS
   ৬টি বিষয়ে ৬০টি করে = মোট ৩৬০টি প্রশ্ন
===================================================== */

function makeQuestions() {

  /* ---------- বাংলা ---------- */

  const banglaBase = [

    ["‘সুখ’-এর বিপরীত শব্দ কী?", ["আনন্দ","দুঃখ","শান্তি","হাসি"], 1],
    ["‘আলো’-এর বিপরীত শব্দ কী?", ["রোদ","অন্ধকার","আগুন","সূর্য"], 1],
    ["‘জল’-এর সমার্থক শব্দ কোনটি?", ["আগুন","পানি","বায়ু","মাটি"], 1],
    ["‘সূর্য’-এর সমার্থক কোনটি?", ["রবি","শশী","ধরা","নিশা"], 0],
    ["‘চাঁদ’-এর সমার্থক কোনটি?", ["রবি","শশী","অনল","পবন"], 1],
    ["‘বায়ু’-এর সমার্থক কোনটি?", ["পবন","অনল","জল","ধরা"], 0],
    ["‘আগুন’-এর সমার্থক কোনটি?", ["অনল","পবন","শশী","বারি"], 0],
    ["‘আমি’ কোন পদ?", ["বিশেষ্য","সর্বনাম","বিশেষণ","ক্রিয়া"], 1],
    ["‘সুন্দর ফুল’—এখানে বিশেষণ কোনটি?", ["ফুল","সুন্দর","এখানে","কোনোটিই নয়"], 1],
    ["‘রহিম স্কুলে যায়’—ক্রিয়া কোনটি?", ["রহিম","স্কুলে","যায়","স্কুল"], 2],

    ["‘সততা’ কোন ধরনের বিশেষ্য?", ["ব্যক্তিবাচক","ভাববাচক","বস্তুবাচক","জাতিবাচক"], 1],
    ["‘মানুষ’ কোন ধরনের বিশেষ্য?", ["জাতিবাচক","ব্যক্তিবাচক","ভাববাচক","ক্রিয়াবাচক"], 0],
    ["প্রশ্নবোধক বাক্যের শেষে কোন চিহ্ন বসে?", ["।","!","?",";"], 2],

    ["‘দরজা বন্ধ করো’ কী ধরনের বাক্য?", ["প্রশ্নবোধক","আদেশসূচক","বিস্ময়সূচক","বিবৃতিমূলক"], 1],
    ["‘বাহ! কী সুন্দর!’ কী ধরনের বাক্য?", ["বিস্ময়সূচক","প্রশ্নবোধক","আদেশসূচক","বিবৃতিমূলক"], 0],

  const bangla = [];
  for (let i = 0; i < 60; i++) {
    const q = banglaBase[i % banglaBase.length];
    bangla.push({
      question: q[0],
      options: q[1],
      answer: q[2],

  /* ---------- English ---------- */

  const englishBase = [

  const english = [];
  for (let i = 0; i < 60; i++) {
    const q = englishBase[i % englishBase.length];

      question: q[0],
      options: q[1],
      answer: q[2],
      explanation: "Correct answer: " + q[1][q[2]]
    });
  }


  /* ---------- গণিত ---------- */

  const math = [];

  for (let i = 1; i <= 60; i++) {

    let a = i + 4;
    let b = i % 9 + 2;
    let correct = a + b;

    math.push({
      question: a + " + " + b + " = কত?",
      options: [
        String(correct - 2),
        String(correct),
        String(correct + 2),
        String(correct + 4)
      ],
      answer: 1,
      explanation: a + " + " + b + " = " + correct

  }


  /* ---------- বিজ্ঞান ---------- */

  const scienceBase = [

    ["পানির রাসায়নিক সংকেত কী?", ["CO2","O2","H2O","NaCl"], 2],
    ["সূর্য কী?", ["গ্রহ","উপগ্রহ","নক্ষত্র","ধূমকেতু"], 2],
    ["পৃথিবীর উপগ্রহ কোনটি?", ["সূর্য","চাঁদ","মঙ্গল","শুক্র"], 1],
    ["মানুষের রক্ত পাম্প করে কোন অঙ্গ?", ["ফুসফুস","হৃদপিণ্ড","কিডনি","মস্তিষ্ক"], 1],

    ["পৃথিবী সূর্যের চারদিকে কী করে?", ["ঘূর্ণন","পরিক্রমণ","স্থির থাকে","লাফ দেয়"], 1],
    ["দিন-রাত হওয়ার প্রধান কারণ কী?", ["পৃথিবীর আবর্তন","সূর্যের ঘূর্ণন","চাঁদের গতি","বৃষ্টিপাত"], 0],
    ["শব্দ চলাচলের জন্য কী প্রয়োজন?", ["মাধ্যম","শূন্যস্থান","আলো","অন্ধকার"], 0],
    ["চুম্বক কোন ধাতুকে আকর্ষণ করে?", ["লোহা","কাঠ","কাচ","প্লাস্টিক"], 0],

  const science = [];
  for (let i = 0; i < 60; i++) {
    const q = scienceBase[i % scienceBase.length];

  /* ---------- ICT ---------- */

  const ictBase = [
    ["CPU-এর পূর্ণরূপ কী?", ["Central Processing Unit","Computer Power Unit","Central Program Unit","Control Processing User"], 0],

  /* ---------- BGS ---------- */

  const bgsBase = [

    ["বাংলাদেশের জাতীয় খেলা কী?", ["ক্রিকেট","ফুটবল","কাবাডি","হকি"], 2],
    ["বাংলাদেশ স্বাধীন হয় কত সালে?", ["১৯৪৭","১৯৫২","১৯৭১","১৯৭৫"], 2],
    ["আন্তর্জাতিক মাতৃভাষা দিবস কবে?", ["২১ ফেব্রুয়ারি","২৬ মার্চ","১৬ ডিসেম্বর","১৪ এপ্রিল"], 0],
    ["স্বাধীনতা দিবস কবে?", ["২১ ফেব্রুয়ারি","২৬ মার্চ","১৬ ডিসেম্বর","১ মে"], 1],
    ["বিজয় দিবস কবে?", ["২৬ মার্চ","২১ ফেব্রুয়ারি","১৬ ডিসেম্বর","১৫ আগস্ট"], 2],
    ["বাংলাদেশের জাতীয় কবি কে?", ["রবীন্দ্রনাথ ঠাকুর","কাজী নজরুল ইসলাম","জসীমউদ্দীন","সুকান্ত ভট্টাচার্য"], 1],
    ["বাংলাদেশের মুদ্রার নাম কী?", ["রুপি","টাকা","ডলার","দিনার"], 1],
    ["বাংলাদেশের বৃহত্তম সমুদ্রসৈকত কোনটি?", ["কক্সবাজার","কুয়াকাটা","পতেঙ্গা","সেন্ট মার্টিন"], 0],
    ["বাংলাদেশের দীর্ঘতম নদীগুলোর একটি কোনটি?", ["পদ্মা","বুড়িগঙ্গা","তুরাগ","শীতলক্ষ্যা"], 0],
    ["সুন্দরবন কী ধরনের বন?", ["মরুভূমি","ম্যানগ্রোভ বন","পাহাড়ি বন","চিরহরিৎ বন"], 1],
    ["বাংলাদেশের জাতীয় মসজিদ কোনটি?", ["বায়তুল মোকাররম","ষাট গম্বুজ","তারাবি মসজিদ","সোনা মসজিদ"], 0]
  ];

  const bgs = [];
  for (let i = 0; i < 60; i++) {
    const q = bgsBase[i % bgsBase.length];
    bgs.push({
      question: q[0],
      options: q[1],
      answer: q[2],
      explanation: "সঠিক উত্তর: " + q[1][q[2]]
    });
  }

  return {
    bangla,
    english,
    math,
    science,
    ict,
    bgs
  };
}


/* =====================================================
   QUIZ SYSTEM
===================================================== */

const questionBanks = makeQuestions();

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let selectedSubject = "";
let lastAnswerText = "";


function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}


function startQuiz(amount) {

  selectedSubject =
    document.getElementById("subjectSelect").value;

  let bank = questionBanks[selectedSubject];

  currentQuestions =
    shuffle(bank).slice(0, Math.min(amount, 60));

  currentIndex = 0;
  score = 0;

  document.getElementById("scoreDisplay").innerText =
    "স্কোর: ০";

  document.getElementById("resultArea")
    .classList.add("hidden");

  document.getElementById("quizArea")
    .classList.remove("hidden");

  window.scrollTo({
    top: document.getElementById("quizArea").offsetTop - 20,
    behavior: "smooth"
  });

  showQuestion();
}


function showQuestion() {

  const q = currentQuestions[currentIndex];

  document.getElementById("questionNumber").innerText =
    "প্রশ্ন " + (currentIndex + 1) +
    "/" + currentQuestions.length;

  document.getElementById("question").innerText =
    q.question;

  document.getElementById("progressBar").style.width =
    ((currentIndex + 1) / currentQuestions.length * 100) + "%";

  const optionsDiv =
    document.getElementById("options");

  optionsDiv.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option-btn";
    button.innerText = option;

    button.onclick = () =>
      selectAnswer(index);

    optionsDiv.appendChild(button);
  });

  document.getElementById("explanation")
    .classList.add("hidden");

  document.getElementById("nextButton")
    .classList.add("hidden");
}


function selectAnswer(selected) {

  const q = currentQuestions[currentIndex];

  const buttons =
    document.querySelectorAll(".option-btn");

  buttons.forEach(button => {
    button.disabled = true;
  });

  if (selected === q.answer) {

    score++;

    buttons[selected].classList.add("correct");

  } else {

    buttons[selected].classList.add("wrong");

    buttons[q.answer].classList.add("correct");
  }

  document.getElementById("scoreDisplay").innerText =
    "স্কোর: " + score;

  document.getElementById("explanationText").innerText =
    q.explanation;

  document.getElementById("explanation")
    .classList.remove("hidden");

  document.getElementById("nextButton")
    .classList.remove("hidden");
}


function nextQuestion() {

  currentIndex++;

  if (currentIndex >= currentQuestions.length) {
    finishQuiz();
  } else {
    showQuestion();
  }
}


function finishQuiz() {

  document.getElementById("quizArea")
    .classList.add("hidden");

  document.getElementById("resultArea")
    .classList.remove("hidden");

  const total = currentQuestions.length;

  const percent =
    Math.round((score / total) * 100);

  const wrong = total - score;

  document.getElementById("correctCount")
    .innerText = score;

  document.getElementById("wrongCount")
    .innerText = wrong;

  document.getElementById("percentage")
    .innerText = percent + "%";

  document.getElementById("resultText")
    .innerText =
      "তোমার স্কোর: " + score +
      " / " + total +
      " (" + percent + "%)";

  window.scrollTo({
    top: document.getElementById("resultArea").offsetTop - 20,
    behavior: "smooth"
  });
}


function restartQuiz() {

  document.getElementById("resultArea")
    .classList.add("hidden");

  document.getElementById("quizArea")
    .classList.add("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =====================================================
   BANGLA VOICE
===================================================== */

function speakAnswer() {

  if (!("speechSynthesis" in window)) {

    alert("এই ফোনের Browser Voice সুবিধা পাওয়া যায়নি।");

    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(lastAnswerText);

  speech.lang = "bn-BD";
  speech.rate = 0.9;
  speech.pitch = 1;
  speech.volume = 1;

  const voices =
    window.speechSynthesis.getVoices();

  const banglaVoice =
    voices.find(v =>
      v.lang &&
      v.lang.toLowerCase().startsWith("bn")
    );

  if (banglaVoice) {
    speech.voice = banglaVoice;
  }

  window.speechSynthesis.speak(speech);
}


window.speechSynthesis &&
window.speechSynthesis.addEventListener(
  "voiceschanged",
  function() {
    window.speechSynthesis.getVoices();
  }
);

</script>
