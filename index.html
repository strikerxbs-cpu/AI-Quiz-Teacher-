<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI School Quiz Teacher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #f0fdf4);
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-align: center;
      padding: 22px 12px;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
    }

    .container {
      max-width: 650px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,.12);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 16px;
      margin-top: 7px;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .option {
      background: #f8fafc;
      color: #172033;
      border: 2px solid #e2e8f0;
      text-align: left;
      margin: 9px 0;
    }

    .option.correct {
      background: #dcfce7;
      border-color: #16a34a;
    }

    .option.wrong {
      background: #fee2e2;
      border-color: #dc2626;
    }

    #result {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      min-height: 30px;
      margin: 12px 0;
    }

    #nextBtn {
      display: none;
      background: #16a34a;
    }

    #voiceBtn {
      background: #7c3aed;
    }

    .score {
      text-align: center;
      font-weight: bold;
      color: #475569;
    }

    .teacher {
      background: #eff6ff;
      border-left: 5px solid #2563eb;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 AI School Quiz Teacher</h1>
  <p>শিখি • খেলি • জ্ঞান বাড়াই</p>
</header>

<div class="container">

  <div class="card">
    <label for="subject">📚 বিষয় নির্বাচন করো</label>

    <select id="subject" onchange="startQuiz()">
      <option value="বাংলা">বাংলা</option>
      <option value="ইংরেজি">ইংরেজি</option>
      <option value="গণিত">গণিত</option>
      <option value="বিজ্ঞান">বিজ্ঞান</option>
      <option value="আইসিটি">আইসিটি</option>
      <option value="বাংলাদেশ ও বিশ্বপরিচয়">বাংলাদেশ ও বিশ্বপরিচয়</option>
    </select>
  </div>

  <div class="card">

    <div class="score" id="score">
      প্রশ্ন ১ / ৬০ | স্কোর: ০
    </div>

    <div class="question" id="question">
      প্রশ্ন লোড হচ্ছে...
    </div>

    <div id="options"></div>

    <div id="result"></div>

    <div class="teacher" id="teacher">
      🤖 রোবট শিক্ষক: একটি উত্তর নির্বাচন করো।
    </div>

    <button id="voiceBtn" onclick="speakCurrent()">
      🔊 প্রশ্ন/ফলাফল শুনুন
    </button>

    <button id="nextBtn" onclick="nextQuestion()">
      ➡️ পরের প্রশ্ন
    </button>

  </div>

</div>
